name: Deploy Plain HTML Site to GitHub Pages (Queued)

on:
  push:
    branches: ["gh-pages"]  # or your deployment branch

# ensures deployments are serialized — one at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # No build step needed for plain HTML — just package the files
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # uploads all files in the repo root (adjust if needed)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
