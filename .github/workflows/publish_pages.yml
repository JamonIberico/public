name: Fast Deploy (Plain HTML)

on:
  push:
    branches: ["gh-pages"]

# Queue jobs instead of canceling; ensures serialized deployments
# UPDATE: Nope, going back to cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Checkout minimal clone — no history or submodules
      - name: Checkout minimal
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # Skip build — directly upload files
      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .  # or specify subfolder (e.g., ./public or ./dist)

      # Deploy to GitHub Pages
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

